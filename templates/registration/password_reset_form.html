{% extends 'base.html' %}
{% load static %}

{% block content %}
    <form id="passwordForm" method="post" class="flex flex-col items-center justify-center w-[30%] gap-2 mt-12 mb-12 mx-auto p-[20px] rounded-md bg-[#f4fee9] shadow-sm">
         {% csrf_token %}
        <h1 class="form-title text-2xl decoration-6 mb-2 text-center">Please share your email address </h1>
         {{ form.email }}
        <button type="submit">Submit</button>
    </form>


{% endblock %}
