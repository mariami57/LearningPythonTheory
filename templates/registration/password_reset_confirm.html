{% extends 'base.html' %}
{% load static %}

{% block content %}
    <form id="passwordConfirmForm" method="post" class="flex flex-col items-center justify-center w-[60%] gap-2 mt-12 mb-12 mx-auto p-[20px] rounded-md bg-[#f4fee9] shadow-sm text-center">
         {% csrf_token %}
        <h1 class="form-title text-2xl decoration-6 mb-2 text-center">Reset password</h1>
         <div class="w-full flex flex-col gap-4">

            <div class="w-full">
                {{ form.new_password1.label_tag }}
                {{ form.new_password1 }}
                {{ form.new_password1.errors }}
            </div>

            <div class="w-full">
                {{ form.new_password2.label_tag }}
                {{ form.new_password2 }}
                {{ form.new_password2.errors }}
            </div>

        </div>
        <button type="submit">Submit</button>
    </form>


{% endblock %}
